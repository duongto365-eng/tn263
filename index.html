<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiểm tra trắc nghiệm TN 263</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
:root{
  --paper:#f2f4f7;--sheet:#ffffff;--ink:#1b2433;--muted:#5b6677;--rule:#d8dde5;
  --red:#c0363a;--red-soft:#fbeaea;--jade:#1d7a5a;--jade-soft:#e2f2eb;--amber:#a86200;--amber-soft:#fdf1dc;
  --ui:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --han:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --han-display:"Noto Serif SC","Songti SC","SimSun",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10151c;--sheet:#18202a;--ink:#e5eaf1;--muted:#99a5b4;--rule:#2c3643;
  --red:#ee6a6a;--red-soft:#3a2023;--jade:#4dc59b;--jade-soft:#15302a;--amber:#f0b35a;--amber-soft:#372a15;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151c;--sheet:#18202a;--ink:#e5eaf1;--muted:#99a5b4;--rule:#2c3643;
  --red:#ee6a6a;--red-soft:#3a2023;--jade:#4dc59b;--jade-soft:#15302a;--amber:#f0b35a;--amber-soft:#372a15;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700}
.brand .han{font-family:var(--han-display);color:var(--red);font-size:20px}
.top .sp{flex:1}
.who{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who b{color:var(--ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;padding:4px 10px;border:1.5px solid var(--rule);border-radius:6px}
.timer.warn{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.timer.crit{color:var(--red);border-color:var(--red);background:var(--red-soft)}
h1{font-size:26px;line-height:1.25;margin:28px 0 6px;text-wrap:balance}
h2{font-size:18px;margin:0 0 10px}
.lead{color:var(--muted);max-width:66ch;margin:0 0 20px}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:6px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f span.h{font-weight:400;color:var(--muted);font-size:13px}
input[type=text]{border:1.5px solid var(--rule);background:var(--sheet);border-radius:6px;padding:10px 12px;width:100%}
input[type=text]:focus{border-color:var(--ink);outline:none}
.err{color:var(--red);font-size:13px;min-height:1em}
.note{font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--red)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-family:var(--han-display);font-size:40px;color:var(--rule);line-height:1}
.namebar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:8px;border:1.5px solid var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:600}
.namebar.over{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.namebar .clock{font-variant-numeric:tabular-nums;font-size:20px}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;margin-top:20px;align-items:start}
.card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px}
.card h3{font-size:15px;margin:0 0 8px;color:var(--red);letter-spacing:.06em}
.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.nav button{border:1.5px solid var(--red);color:var(--red);background:transparent;border-radius:4px;padding:4px 0;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.nav button.done{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.card .cnt{font-size:13px;color:var(--muted);margin:10px 0}
.qs{display:flex;flex-direction:column;gap:14px}
.q{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:16px;scroll-margin-top:90px}
.q .stem{display:flex;gap:8px;align-items:baseline}
.q .no{font-weight:700;font-variant-numeric:tabular-nums;color:var(--red);min-width:2.2em;flex:none}
.q .txt{font-family:var(--han),var(--ui);font-size:17px;line-height:1.8;min-width:0}
.q .txt p{margin:0}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:baseline;text-align:left;border:1.5px solid var(--rule);background:transparent;border-radius:6px;padding:9px 12px;font-family:var(--han),var(--ui);font-size:16px;line-height:1.6}
.opt b{color:var(--red);font-family:var(--ui);flex:none;min-width:1.4em}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.opt[aria-pressed="true"] b{color:var(--sheet)}
.opt.ok{border-color:var(--jade);background:var(--jade-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.pager{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}
.warnbar{margin-bottom:14px;padding:10px 14px;border-radius:6px;background:var(--amber-soft);color:var(--amber);font-weight:600;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog{background:var(--sheet);border-radius:10px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.score{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.score .n{font-size:64px;font-weight:700;line-height:1}
.score .d{font-size:22px;color:var(--muted)}
.ok-t{color:var(--jade);font-weight:600}.bad-t{color:var(--red);font-weight:600}
@media (max-width:820px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .card{position:static;order:-1}
  .nav{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:480px){.nav{grid-template-columns:repeat(6,1fr)}h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><h1>Kiểm tra trắc nghiệm TN 263</h1><p class="lead">Đang tải bài kiểm tra…</p></div></div>
<script>
(function(){
"use strict";
/* Trang đặt trên GitHub Pages: gọi Apps Script qua fetch, KHÔNG kèm tài khoản Google (credentials:"omit").
   Câu hỏi do máy chủ gửi khi bấm Bắt đầu; đáp án không bao giờ có trong trang này trước khi nộp. */
var API="https://script.google.com/macros/s/AKfycbwbM2GPSrv9WvHVcgjZHxSyh4vWiGrTZHgYIIx3Qj5Wy7npfhAevn4kTz8qBUs4Na61/exec";
function call(fn){var args=[].slice.call(arguments,1);
  return fetch(API,{method:"POST",credentials:"omit",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
    .then(function(j){if(!j||!j.ok)throw new Error((j&&j.error)||"Máy chủ lỗi");return j.data})}

var LET="ABCD";
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return (Math.round(n*100)/100).toFixed(2).replace(".",",")}
function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function tstr(ts){if(!ts)return "";var d=new Date(ts);function p(n){return n<10?"0"+n:n}return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())}
function mmss(ms){ms=Math.max(0,ms);var s=Math.floor(ms/1000);var m=Math.floor(s/60);s=s%60;return (m<10?"0"+m:m)+":"+(s<10?"0"+s:s)}

var KEY_EXAM="tn263:exam",KEY_DONE="tn263:done";
var S={view:"loading",cfg:null,skew:0,exam:null,res:null,err:"",confirm:false,busy:false,sending:false,sendErr:"",fName:"",fMssv:"",fPledge:false,loadErr:""};
var app=document.getElementById("app");
function persist(){if(S.exam)lsSet(KEY_EXAM,S.exam)}

/* ========= KHỞI ĐỘNG ========= */
var pollT=null,lobbyT=null;
function boot(){
  var ex=lsGet(KEY_EXAM);
  if(ex&&ex.token&&!lsGet(KEY_DONE)){S.exam=ex;S.view="exam";render();return}
  var done=lsGet(KEY_DONE);if(done){S.res=done;S.view="result";render();return}
  loadCfg();
}
function loadCfg(){
  clearTimeout(pollT);
  call("getConfig").then(function(c){
    // chỉ vẽ lại khi trạng thái mở/giờ mở thay đổi, để không làm mất chữ SV đang gõ
    var o=S.cfg,n=c.session,changed=!o||o.open!==n.open||o.openedAt!==n.openedAt||o.name!==n.name||S.loadErr;
    S.cfg=n;S.skew=Date.now()-c.now;S.loadErr="";if(S.view==="loading")S.view="lobby";if(S.view==="lobby"&&changed)render();pollT=setTimeout(loadCfg,20000)},
    function(){S.loadErr="Không kết nối được máy chủ bài kiểm tra. Kiểm tra mạng rồi tải lại trang.";if(S.view==="loading")S.view="lobby";if(S.view==="lobby")render();pollT=setTimeout(loadCfg,20000)});
}

/* ========= GIAO DIỆN ========= */
function topbar(){
  var ex=S.exam,right="";
  if(S.view==="exam"&&ex)right='<div class="who">Thí sinh: <b>'+esc(ex.name)+"</b> · "+esc(ex.cls)+'</div><div class="timer" id="timer">--:--</div>';
  return '<div class="top"><div class="in"><div class="brand"><span class="han">测验</span><span>TN 263 · Trắc nghiệm</span></div><div class="sp"></div>'+right+"</div></div>";
}
function render(){
  var h=topbar();
  if(S.view==="exam")h+=viewExam();
  else if(S.view==="result")h+=viewResult();
  else if(S.view==="loading")h+='<div class="wrap"><h1>Kiểm tra trắc nghiệm TN 263</h1><p class="lead">Đang tải bài kiểm tra…</p></div>';
  else h+=viewLobby();
  if(S.confirm)h+=viewConfirm();
  if(S.sending||S.sendErr)h+=viewSending();
  app.innerHTML=h;
  if(S.view==="exam")tick();
  if(S.view==="lobby")lobbyTick();
}

/* ----- Sảnh: điền họ tên, tối đa 2 phút ----- */
function nameDeadline(){var c=S.cfg;return c&&c.openedAt?c.openedAt+c.nameMinutes*60000+S.skew:0}
function viewLobby(){
  var c=S.cfg;
  var h='<div class="wrap"><h1>Kiểm tra trắc nghiệm TN 263</h1>';
  if(S.loadErr)h+='<div class="warnbar">'+esc(S.loadErr)+"</div>";
  if(!c||!c.open)return h+'<p class="lead">Bài kiểm tra trắc nghiệm, chấm theo thang điểm 10.</p><div class="panel empty"><div class="big">未开放</div><p><b>Bài kiểm tra chưa mở.</b></p><p class="note">Trang tự kiểm tra lại sau mỗi 20 giây. Khi giáo viên mở bài, mẫu điền họ tên sẽ hiện ở đây.</p></div></div>';
  h+='<p class="lead">'+c.n+' câu trắc nghiệm, thang điểm 10. Tổng thời gian <b>'+c.minutes+' phút</b> tính từ lúc giáo viên mở bài, <b>gồm cả thời gian ghi tên</b> (khoảng '+c.nameMinutes+' phút). Hãy ghi tên nhanh rồi bấm <b>Bắt đầu làm bài</b>. Bài tự nộp khi hết giờ.</p>';
  h+='<div class="stack">';
  if(nameDeadline())h+='<div class="namebar" id="namebar"><span id="nametext">Thời gian điền họ tên còn</span><span class="clock" id="nameclock">--:--</span></div>';
  h+='<form class="panel stack" id="startForm" novalidate>'+
   '<div class="note"><b>'+esc(c.name)+'</b></div>'+
   '<label class="f" for="fName">Họ và tên đầy đủ <span class="h">Ghi đủ họ, tên đệm và tên, có dấu. Ví dụ: Nguyễn Thị Minh Anh</span><input type="text" id="fName" autocomplete="name" maxlength="60" value="'+esc(S.fName)+'"></label>'+
   '<label class="f" for="fMssv">Mã số sinh viên <span class="h">Không bắt buộc</span><input type="text" id="fMssv" maxlength="20" value="'+esc(S.fMssv)+'"></label>'+
   '<label class="check" for="fPledge"><input type="checkbox" id="fPledge"'+(S.fPledge?" checked":"")+'><span>Em cam kết tự làm bài, không trao đổi và không dùng tài liệu. Em hiểu rằng giáo viên theo dõi trực tiếp tiến độ làm bài, và mỗi lần em chuyển sang tab, ứng dụng hoặc cửa sổ khác đều được ghi lại.</span></label>'+
   '<div class="err">'+esc(S.err)+'</div><div class="row"><button class="btn red" type="submit"'+(S.busy?" disabled":"")+">"+(S.busy?"Đang tạo đề…":"Bắt đầu làm bài")+"</button></div></form></div></div>";
  return h;
}
function lobbyTick(){
  clearTimeout(lobbyT);if(S.view!=="lobby")return;
  var bar=$("#namebar"),nd=nameDeadline();if(!bar||!nd)return;
  var left=nd-Date.now(),c=S.cfg;
  var rest=c.openedAt+S.skew+c.minutes*60000-Date.now();
  if(left>0){$("#nameclock").textContent=mmss(left);bar.className="namebar";$("#nametext").textContent="Thời gian ghi họ tên còn"}
  else{bar.className="namebar over";$("#nametext").textContent="Đã quá thời gian ghi tên. Đồng hồ bài kiểm tra đang chạy, thời gian còn lại";$("#nameclock").textContent=mmss(rest)}
  lobbyT=setTimeout(lobbyTick,1000-(Date.now()%1000)+5);
}
function cleanName(s){return s.normalize("NFC").replace(/\s+/g," ").trim().split(" ").map(function(w){return w.charAt(0).toLocaleUpperCase("vi")+w.slice(1).toLocaleLowerCase("vi")}).join(" ")}
function validName(n){return n.length>=6&&n.split(" ").length>=2&&/^[\p{L}\p{M} ]+$/u.test(n)}
function readForm(){S.fName=($("#fName")||{}).value||S.fName;S.fMssv=($("#fMssv")||{}).value||S.fMssv;var p=$("#fPledge");if(p)S.fPledge=p.checked}
function startExam(){
  readForm();var name=cleanName(S.fName),mssv=S.fMssv.trim();S.fName=name;
  if(!validName(name)){S.err="Hãy ghi đầy đủ họ và tên (ít nhất 2 từ, chỉ gồm chữ cái).";return render()}
  if(!S.fPledge){S.err="Hãy đánh dấu vào ô cam kết trước khi bắt đầu.";return render()}
  S.err="";S.busy=true;render();
  call("startExam",name,mssv).then(function(r){S.busy=false;
    if(!r||r.error){S.err=(r&&r.error)||"Chưa tạo được đề. Thử lại.";return render()}
    var skew=Date.now()-r.now;
    S.exam={token:r.token,monRow:r.monRow||0,questions:r.questions,cls:r.cls,name:r.name,mssv:r.mssv,start:r.start+skew,deadline:r.deadline+skew,ans:{},leaves:0};
    S.view="exam";clearTimeout(pollT);clearTimeout(lobbyT);persist();render();window.scrollTo(0,0);
  },function(){S.busy=false;S.err="Không kết nối được máy chủ. Kiểm tra mạng rồi bấm Bắt đầu lại.";render()});
}

/* ----- Làm bài ----- */
function stemHtml(lines){return lines.map(function(l){return "<p>"+esc(l)+"</p>"}).join("")}
function viewExam(){
  var ex=S.exam,Q=ex.questions,n=Q.length;
  var h='<div class="wrap"><div class="exam"><div>';
  if(ex.leaves>0)h+='<div class="warnbar" style="margin-top:0">Em đã rời khỏi màn hình làm bài '+ex.leaves+" lần. Giáo viên đang thấy số lần này.</div>";
  h+='<div class="qs">';
  Q.forEach(function(q,i){var no=i+1,v=ex.ans[no];
    h+='<div class="q" id="q'+no+'"><div class="stem"><span class="no">'+no+'.</span><div class="txt">'+stemHtml(q.q)+'</div></div><div class="opts" role="group" aria-label="Câu '+no+'">'+
      q.o.map(function(o,k){return '<button class="opt" data-q="'+no+'" data-v="'+k+'" aria-pressed="'+(v===k)+'"><b>'+LET[k]+'.</b><span>'+esc(o)+"</span></button>"}).join("")+"</div></div>"});
  h+='</div><div class="pager"><button class="btn red" data-act="askSubmit">Nộp bài</button></div></div>';
  var answered=Object.keys(ex.ans).length;
  h+='<aside class="card"><h3>Phiếu trả lời</h3><div class="nav">'+Q.map(function(q,i){var no=i+1;return '<button data-act="jump" data-n="'+no+'" class="'+(ex.ans[no]!==undefined?"done":"")+'">'+no+"</button>"}).join("")+'</div>';
  h+='<div class="cnt">Đã làm <b>'+answered+"</b>/"+n+' câu</div><button class="btn red" style="width:100%" data-act="askSubmit">Nộp bài</button></aside></div></div>';
  return h;
}
function viewConfirm(){var n=S.exam.questions.length,left=n-Object.keys(S.exam.ans).length;
  return '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h2>Nộp bài?</h2><p>'+(left?"Em còn <b>"+left+"</b> câu chưa làm. Câu chưa làm được tính là sai.":"Em đã làm đủ "+n+" câu.")+' Sau khi nộp sẽ không sửa được nữa.</p><div class="row"><button class="btn ghost" data-act="cancelSubmit">Quay lại làm tiếp</button><button class="btn red" data-act="submit">Nộp bài</button></div></div></div>'}
function viewSending(){
  if(S.sending)return '<div class="overlay"><div class="dialog" role="status"><h2>Đang nộp bài…</h2><p class="note">Đừng đóng trang cho đến khi thấy điểm.</p></div></div>';
  return '<div class="overlay"><div class="dialog" role="alertdialog"><h2>Chưa nộp được bài</h2><p>'+esc(S.sendErr)+'</p><p class="note">Bài làm của em vẫn được giữ trên máy này.</p><div class="row"><button class="btn red" data-act="retry">Nộp lại</button></div></div></div>';
}
var tickT=null,lastPing=0;
function tick(){
  clearTimeout(tickT);if(S.view!=="exam"||!S.exam)return;
  var left=S.exam.deadline-Date.now(),el=$("#timer");
  if(el){el.textContent=mmss(left);el.className="timer"+(left<60000?" crit":left<300000?" warn":"")}
  if(left<=0){if(!S.sending&&!S.sendErr)submit(true);return}
  tickT=setTimeout(tick,1000-(Date.now()%1000)+5);
  if(Date.now()-lastPing>30000)pingNow();
}
/* báo tiến độ cho trang Theo dõi của giáo viên */
function pingNow(){var ex=S.exam;if(!ex||S.sending||!ex.token)return;lastPing=Date.now();
  call("ping",ex.token,ex.monRow,Object.keys(ex.ans).length,ex.leaves).then(function(r){if(r&&r.row&&S.exam===ex&&ex.monRow!==r.row){ex.monRow=r.row;persist()}},function(){})}
/* rời màn hình: chuyển tab/ứng dụng hoặc bấm sang cửa sổ khác quá 1,5 giây */
var away=false,blurT=null;
function goAway(){if(away||S.view!=="exam"||!S.exam||S.sending)return;away=true;S.exam.leaves++;persist();pingNow()}
function comeBack(){clearTimeout(blurT);if(!away)return;away=false;if(S.view==="exam"){var y=window.scrollY;render();window.scrollTo(0,y);pingNow()}}
function submit(auto){
  var ex=S.exam;if(!ex||S.sending)return;
  S.confirm=false;S.sending=true;S.sendErr="";ex.auto=ex.auto||!!auto;persist();render();
  call("submitExam",ex.token,ex.ans,ex.leaves,ex.auto,ex.monRow).then(function(r){S.sending=false;
    if(!r||r.error){S.sendErr=(r&&r.error)||"Máy chủ chưa nhận bài.";render();return}
    var done={rec:{name:ex.name,mssv:ex.mssv,cls:r.cls||ex.cls,score:r.score,c:r.c,n:r.n,end:r.end,late:r.late,auto:ex.auto},exam:ex,correct:r.correct||null};
    lsSet(KEY_DONE,done);lsDel(KEY_EXAM);S.exam=null;S.res=done;S.view="result";clearTimeout(tickT);render();window.scrollTo(0,0);
  },function(){S.sending=false;S.sendErr="Không kết nối được máy chủ. Kiểm tra mạng rồi bấm Nộp lại.";render()});
}

/* ----- Kết quả ----- */
function viewResult(){
  var r=S.res,rec=r.rec;
  var h='<div class="wrap"><h1>Em đã nộp bài</h1><p class="lead">'+esc(rec.name)+(rec.mssv?" · "+esc(rec.mssv):"")+" · "+esc(rec.cls)+" · nộp lúc "+tstr(rec.end)+(rec.auto?" (tự nộp khi hết giờ)":"")+"</p>";
  h+='<div class="panel stack"><div class="score"><span class="n">'+fmt(rec.score)+'</span><span class="d">/ 10 điểm</span></div><p>Đúng <b>'+rec.c+"</b>/"+rec.n+" câu.</p>";
  h+='<p class="ok-t">Kết quả đã được ghi vào bảng điểm của giáo viên.</p>'+(rec.late?'<p class="bad-t">Bài được ghi nhận là nộp trễ.</p>':"")+"</div>";
  if(r.correct&&r.exam)h+=viewReview(r.exam,r.correct);
  return h+"</div>";
}
function viewReview(ex,correct){
  var h='<h2 style="margin-top:28px">Xem lại bài làm</h2><div class="qs">';
  ex.questions.forEach(function(q,i){var no=i+1,v=ex.ans[no],c=correct[i];
    h+='<div class="q"><div class="stem"><span class="no">'+no+'.</span><div class="txt">'+stemHtml(q.q)+'</div></div><div class="opts">'+
      q.o.map(function(o,k){var cls=k===c?" ok":(k===v?" bad":"");return '<div class="opt'+cls+'"><b>'+LET[k]+'.</b><span>'+esc(o)+(k===c?" ✓":"")+(k===v&&k!==c?" (em chọn)":"")+"</span></div>"}).join("")+
      '</div>'+(v===undefined?'<p class="note bad-t">Em chưa làm câu này.</p>':"")+"</div>"});
  return h+"</div>";
}

/* ========= SỰ KIỆN ========= */
app.addEventListener("submit",function(e){if(e.target.id==="startForm"){e.preventDefault();if(!S.busy)startExam()}});
app.addEventListener("input",function(e){if(e.target.id==="fName")S.fName=e.target.value;if(e.target.id==="fMssv")S.fMssv=e.target.value});
app.addEventListener("change",function(e){if(e.target.id==="fPledge")S.fPledge=e.target.checked});
app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var q=b.getAttribute("data-q");
  if(q&&S.exam&&!S.sending){var n=+q,v=+b.getAttribute("data-v");if(S.exam.ans[n]===v)delete S.exam.ans[n];else S.exam.ans[n]=v;persist();var y=window.scrollY;render();window.scrollTo(0,y);return}
  var act=b.getAttribute("data-act");if(!act)return;
  switch(act){
  case "jump":var el=document.getElementById("q"+b.getAttribute("data-n"));if(el)el.scrollIntoView({block:"start"});break;
  case "askSubmit":S.confirm=true;render();break;
  case "cancelSubmit":S.confirm=false;render();break;
  case "submit":submit(false);break;
  case "retry":S.sendErr="";submit(S.exam&&S.exam.auto);break;
  }
});
document.addEventListener("visibilitychange",function(){if(document.hidden)goAway();else comeBack()});
window.addEventListener("blur",function(){clearTimeout(blurT);blurT=setTimeout(function(){if(!document.hasFocus())goAway()},1500)});
window.addEventListener("focus",comeBack);
boot();
})();
</script>
